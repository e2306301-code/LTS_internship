<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>給湯器 かんたん点検</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap');

    :root {
      --bg: #FBF7F0;
      --bg-rgb: 251,247,240;
      --surface: #FFFFFF;
      --surface-rgb: 255,255,255;
      --ink: #1F1B16;
      --ink-rgb: 31,27,22;
      --ink-sub: #4A433A;
      --ink-sub-rgb: 74,67,58;
      --line: #D9CFC0;
      --line-rgb: 217,207,192;
      --accent: #B8481E;
      --accent-press: #93391A;
      --accent-rgb: 184,72,30;
      --danger: #A61B1B;
      --danger-rgb: 166,27,27;
      --danger-bg: #FCE9E7;
      --safe: #1F6B3A;
      --safe-rgb: 31,107,58;
      --safe-bg: #E6F3EA;
      --focus: #1B4FA0;
      --focus-rgb: 27,79,160;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--bg); }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 20px;
      line-height: 1.8;
      letter-spacing: .03em;
    }

    button, input { font: inherit; }

    button, a { -webkit-tap-highlight-color: transparent; }

    button { cursor: pointer; }

    button:disabled { cursor: not-allowed; }

    .app-shell {
      width: min(100%, 704px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 32px 144px;
    }

    .app-header { min-height: 88px; }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
    }

    .back-button {
      min-width: 160px;
      min-height: 64px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      padding: 12px 18px;
      text-align: left;
    }

    .back-button:hover { background: rgba(var(--ink-rgb), .06); }
    .back-button:active { transform: translateY(2px); }
    .back-button:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .progress-wrap { flex: 1; }

    .progress-label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink-sub);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      text-align: right;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: rgba(var(--line-rgb), .5);
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 200ms ease-out;
    }

    .screen {
      animation: appear 200ms ease-out;
    }

    .screen-heading {
      margin: 24px 0 16px;
      font-size: 32px;
      line-height: 1.4;
      letter-spacing: .02em;
    }

    .question-heading {
      margin: 24px 0 16px;
      font-size: 26px;
      line-height: 1.5;
      letter-spacing: .02em;
    }

    .lead {
      margin: 0 0 28px;
      font-size: 20px;
    }

    .subtle { color: var(--ink-sub); font-size: 18px; }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      margin-top: 16px;
      padding: 5px 12px;
      border: 2px solid var(--accent);
      border-radius: 99px;
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
    }

    .start-hero {
      margin: 24px 0 32px;
      padding: 32px;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08);
    }

    .start-hero .screen-heading { margin-top: 0; }

    .demo-box {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 2px dashed var(--line);
    }

    .demo-title {
      margin: 0 0 16px;
      color: var(--ink-sub);
      font-size: 18px;
      font-weight: 700;
    }

    .button-stack { display: grid; gap: 16px; }

    .start-photo-action { margin-top: 16px; }

    .btn-primary, .btn-secondary, .btn-call {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 72px;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
    }

    .btn-primary {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: var(--surface);
      box-shadow: 0 4px 0 var(--accent-press);
    }

    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-press); }
    .btn-primary:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .btn-primary:disabled { border-color: var(--line); background: var(--line); color: var(--ink-sub); box-shadow: none; }

    .btn-secondary {
      border: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(var(--ink-rgb), .18);
    }

    .btn-secondary:hover { background: rgba(var(--ink-rgb), .05); }
    .btn-secondary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(var(--ink-rgb), .18); }
    .btn-secondary:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .btn-secondary:disabled { border-color: var(--line); background: var(--line); color: var(--ink-sub); box-shadow: none; }

    .btn-call {
      min-height: 88px;
      border: 2px solid var(--danger);
      background: var(--danger);
      color: var(--surface);
      box-shadow: 0 4px 0 rgba(var(--danger-rgb), .65);
    }

    .btn-call:hover { filter: brightness(1.08); }
    .btn-call:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(var(--danger-rgb), .65); }
    .btn-call:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .screen-actions { display: grid; gap: 16px; margin-top: 32px; }

    .input-group { display: grid; gap: 24px; margin-top: 32px; }

    .num-field {
      padding: 20px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08);
    }

    .num-field.is-invalid { border-color: var(--danger); }

    .field-label {
      display: block;
      margin-bottom: 4px;
      font-size: 22px;
      font-weight: 700;
    }

    .field-label small { display: block; color: var(--ink-sub); font-size: 18px; font-weight: 400; }

    .field-hint { margin: 8px 0 12px; color: var(--ink-sub); font-size: 18px; line-height: 1.6; }

    .stepper {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 72px;
      align-items: center;
      gap: 12px;
    }

    .step-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }

    .step-button:hover { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
    .step-button:active { transform: translateY(2px); }
    .step-button:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .step-button:disabled { border-color: var(--line); background: var(--line); color: var(--ink-sub); }

    .number-input {
      width: 100%;
      min-width: 0;
      min-height: 72px;
      padding: 12px 16px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .03em;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .number-input:hover { border-color: var(--accent); }
    .number-input:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .num-field.is-invalid .number-input { border-color: var(--danger); }

    .field-error {
      min-height: 32px;
      margin: 8px 0 0;
      color: var(--danger);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .field-range-warning { margin-top: 12px; color: var(--danger); font-size: 18px; font-weight: 700; line-height: 1.5; }
    .field-range-warning .btn-call { min-height: 64px; margin-top: 12px; padding: 12px 16px; font-size: 18px; }

    .rotation-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 12px; }

    .rotation-button {
      min-height: 72px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      font-size: 26px;
      font-weight: 700;
    }

    .rotation-button:hover { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
    .rotation-button:active { transform: translateY(2px); }
    .rotation-button:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .rotation-button[aria-pressed="true"] { border: 4px solid var(--accent); background: rgba(var(--accent-rgb), .08); }

    .next-reason { margin: 0; color: var(--ink-sub); font-size: 18px; text-align: center; }

    .confirm-list { display: grid; gap: 20px; margin-top: 28px; }

    .photo-notice {
      margin: 0 0 24px;
      padding: 18px;
      border: 3px solid var(--accent);
      border-radius: 16px;
      background: rgba(var(--accent-rgb), .08);
      font-weight: 700;
      line-height: 1.6;
    }

    .photo-preview {
      margin: 24px 0;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .photo-preview img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 8px;
    }

    .photo-preview figcaption { margin-top: 8px; color: var(--ink-sub); font-size: 18px; line-height: 1.5; }

    .photo-status,
    .photo-feedback {
      margin: 24px 0;
      padding: 20px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      font-weight: 700;
      line-height: 1.6;
    }

    .photo-status { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
    .photo-feedback.is-error { border-color: var(--danger); background: var(--danger-bg); }
    .photo-feedback p { margin: 0 0 16px; }

    .camera-stage {
      display: grid;
      gap: 16px;
      margin: 24px 0;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--ink);
    }

    .camera-video {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      background: var(--ink);
    }

    .camera-stage .btn-secondary { border-color: var(--surface); background: var(--surface); }
    .camera-stage .btn-secondary:disabled { border-color: var(--line); background: var(--line); color: var(--ink-sub); box-shadow: none; }
    .hidden-file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

    .confirm-group {
      padding: 24px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08);
    }

    .confirm-group h3 { margin: 0 0 12px; font-size: 22px; }

    .confirm-values { display: grid; gap: 6px; margin: 0; }
    .confirm-row { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .confirm-row:last-child { border-bottom: 0; }
    .confirm-row dt { color: var(--ink-sub); }
    .confirm-row dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
    .edit-button { width: 100%; min-height: 64px; margin-top: 16px; padding: 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 700; }
    .edit-button:hover { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
    .edit-button:active { transform: translateY(2px); }
    .edit-button:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .result-card { padding: 32px; border: 2px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08); }
    .result-card.fault { border-color: var(--danger); background: var(--danger-bg); }
    .result-card.safe { border-color: var(--safe); background: var(--safe-bg); }
    .result-icon { display: block; margin-bottom: 8px; font-size: 56px; line-height: 1.1; }
    .result-card .screen-heading { margin-top: 0; }
    .call-note { margin: 24px 0 0; color: var(--ink-sub); font-size: 18px; }

    .choice-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }

    .choice {
      min-height: 120px;
      padding: 20px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
    }

    .choice:hover { border-color: var(--accent); }
    .choice:active { transform: translateY(2px); }
    .choice:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
    .choice[aria-pressed="true"] { border: 4px solid var(--accent); background: rgba(var(--accent-rgb), .08); }
    .choice .choice-symbol { display: block; margin-bottom: 8px; font-size: 30px; line-height: 1; }
    .choice-emergency { border-color: var(--danger); background: var(--danger-bg); }
    .choice-emergency:hover { border-color: var(--danger); }

    .safe-warning { margin: 20px 0 0; color: var(--danger); font-size: 18px; font-weight: 700; line-height: 1.6; }
    .safe-warning-call { display: inline-block; margin-top: 4px; color: var(--danger); font-size: 18px; font-weight: 700; }
    .safe-warning-call:hover { color: var(--accent-press); }
    .safe-warning-call:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .advice-list { display: grid; gap: 24px; margin-top: 28px; }
    .advice-block { padding: 24px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 2px 8px rgba(var(--ink-rgb), .08); }
    .advice-block h3 { margin: 0 0 16px; font-size: 24px; line-height: 1.5; }
    .advice-steps { margin: 0; padding-left: 1.6em; }
    .advice-steps li { margin: 12px 0; padding-left: 4px; }
    .caution { margin-top: 20px; padding: 16px; border-left: 8px solid var(--accent); background: rgba(var(--accent-rgb), .08); font-weight: 700; }
    .caution strong { display: block; margin-bottom: 4px; }

    .complete-mark { display: inline-flex; align-items: center; justify-content: center; width: 88px; height: 88px; margin-bottom: 16px; border-radius: 50%; background: var(--safe); color: var(--surface); font-size: 48px; font-weight: 700; }

    .bottom-call {
      position: fixed;
      z-index: 5;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 2px solid var(--line);
      background: var(--surface);
      color: var(--ink-sub);
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
    }

    .bottom-call a { display: inline-flex; align-items: center; min-height: 64px; color: var(--ink); font-weight: 700; }
    .bottom-call a:hover { color: var(--accent); }
    .bottom-call a:active { color: var(--accent-press); }
    .bottom-call a:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .aria-region { min-height: 0; }

    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 600px) {
      .app-shell { padding: 16px 16px 154px; }
      .app-header { min-height: 80px; }
      .back-button { min-width: 144px; }
      .screen-heading { font-size: 28px; }
      .question-heading { font-size: 24px; }
      .start-hero, .result-card { padding: 24px; }
      .choice-list { grid-template-columns: 1fr; }
      .confirm-group, .advice-block, .num-field { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <script src="model.js"></script>
  <script src="model_meta.js"></script>
  <script src="logic.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="top-row">
        <button id="back-button" class="back-button" type="button" hidden>← もどる</button>
        <div id="progress-wrap" class="progress-wrap" hidden>
          <span id="progress-label" class="progress-label">ステップ 1 / 5</span>
          <div class="progress-track" role="progressbar" aria-label="点検の進み具合" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
            <div id="progress-bar" class="progress-bar" style="width: 20%"></div>
          </div>
        </div>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
  </div>
  <div class="bottom-call">困ったときは お電話ください 📞 <a href="tel:0120-000-000">0120-000-000（試作用のダミー番号）</a></div>

  <script>
    (() => {
      'use strict';

      const meta = window.ADK_META;
      const app = document.getElementById('app');
      const backButton = document.getElementById('back-button');
      const progressWrap = document.getElementById('progress-wrap');
      const progressLabel = document.getElementById('progress-label');
      const progressBar = document.getElementById('progress-bar');
      const progressTrack = document.querySelector('.progress-track');
      const state = {
        screen: 'start',
        history: [],
        values: Object.fromEntries(meta.features.map((feature) => [feature, ''])),
        symptom: null,
        adviceKey: null,
        result: null,
        editingFromConfirm: false,
        fromPhoto: false
      };

      let cameraStream = null;
      let cameraViewActive = false;
      let photoBusy = false;
      let photoPreviewSrc = '';
      let photoPreviewObjectUrl = '';
      let photoCountMessage = '';
      let photoErrorMessage = '';
      let photoRunId = 0;
      let activeWorker = null;
      let tesseractPromise = null;

      const groups = [
        { number: 1, features: meta.features.slice(0, 5) },
        { number: 2, features: meta.features.slice(5, 10) },
        { number: 3, features: meta.features.slice(10, 15) }
      ];
      const labels = {
        temparature1: '温度', humidity1: '湿度', valtage1: '電圧', usage1: '使用量', rotation1: '回転数',
        temparature2: '温度', humidity2: '湿度', valtage2: '電圧', usage2: '使用量', rotation2: '回転数',
        temparature3: '温度', humidity3: '湿度', valtage3: '電圧', usage3: '使用量', rotation3: '回転数'
      };
      const advice = {
        A: {
          title: '🔌 電源・ブレーカーを確認する',
          steps: ['家のブレーカー（分電盤）が落ちていないか見てください', '給湯器の電源プラグがコンセントから抜けていないか見てください', '雷や大雨のあとは、プラグを抜いて1分待ってから差し直してください（安全装置のリセット）', 'ブレーカーがまたすぐ落ちるときは、漏電のおそれがあります。上げなおさずにお電話ください。'],
          cautions: ['ぬれた手でプラグやブレーカーにさわらないでください。', '大雨のあとで屋外のコンセントやプラグがぬれている・水につかったときは、さわらずにお電話ください。']
        },
        B: {
          title: '🔥 ガスメーターの安全装置を確認する',
          steps: ['ガスメーターの赤いランプが点滅していないか見てください', '点滅していたら、ガス器具をすべて止めてから、メーターの復帰ボタンを奥までしっかり押して、すぐ離してください', 'ガスを使わずに約3分待ち、ランプの点滅が消えたら使えます', '3分たってもまた点滅するときは、ガスもれのおそれがあります。ガス会社に連絡してください', 'ガス栓が閉まっていないかも見てください'],
          cautions: ['ガスのにおいがするときは、この手順はせず、火や電気のスイッチにふれずに窓を開け、ガス会社に連絡してください。', '11・111 以外の番号が出ているときは、使うのをやめてお電話ください。']
        },
        C: {
          title: '🚿 水の量・フィルターの詰まりを確認する',
          steps: ['蛇口を大きく開けてください（水の量が少ないと、お湯をわかす火がつかない仕組みです）', '節水シャワーヘッドを使っている場合は、ふつうのものに替えて試してください', '給湯器の水の入口にあるフィルター（ストレーナ）にゴミが詰まっていることがあります。取扱説明書の手順でお手入れしてください'],
          caution: '分解がむずかしいときは、無理をせずお電話ください。'
        },
        D: {
          title: '❄ 配管の凍結を確認する',
          steps: ['気温が上がって自然にとけるのを待ってください', '急ぐときは、配管にタオルを巻き、ぬるま湯をゆっくりかけてください', '寒い夜は、蛇口から少し水を出しっぱなしにすると凍結を防げます', '給湯器本体にはお湯をかけないでください', 'とけたあと、水もれがないか確認してください。もれていたらお電話ください。'],
          caution: '熱湯はかけないでください。配管が破れるおそれがあります。'
        },
        E: {
          title: '🌡 リモコンの「優先」設定を確認する',
          steps: ['台所とおふろにリモコンがある場合、「優先」ランプがついている方の温度でお湯が出ます', '使う場所のリモコンで「優先」ボタンを押してから、温度を設定してください'],
          caution: null
        }
      };
      const symptoms = [
        ['A', '🔌', 'リモコンの画面が消えている・つかない'],
        ['B', '🔥', 'リモコンにエラー番号『11』か『111』が出て、お湯がつかない'],

        ['F', '？', 'よくわからない（5つの対処法を見る）']
      ];

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      }

      function displayNumber(value) {
        if (value === '' || value === null || value === undefined) return '';
        const numeric = ADKApp.parseValue(value);
        return Number.isFinite(numeric) ? numeric.toFixed(1) : String(value);
      }

      function groupForScreen(screen) {
        return screen.startsWith('input') ? groups[Number(screen.slice(-1)) - 1] : null;
      }

      function progressFor(screen) {
        if (screen === 'photo') return 1;
        if (screen === 'input1') return 1;
        if (screen === 'input2') return 2;
        if (screen === 'input3') return 3;
        if (screen === 'confirm') return 4;
        if (screen !== 'start') return 5;
        return 0;
      }

      function allValuesValid() {
        return ADKApp.allValid(state.values, meta.features, meta.featureMeta);
      }

      function firstInvalidScreen() {
        const groupNumber = ADKApp.firstInvalidGroup(state.values, groups, meta.featureMeta);
        return groupNumber === null ? 'confirm' : `input${groupNumber}`;
      }

      function goToConfirmOrFirstInvalid() {
        go(allValuesValid() ? 'confirm' : firstInvalidScreen());
      }

      function go(screen) {
        if (state.screen === 'photo' && screen !== 'photo') cancelPhotoWork();
        stopCamera();
        if (screen === 'confirm' && !allValuesValid()) screen = firstInvalidScreen();
        if (state.screen !== screen) state.history.push(state.screen);
        state.screen = screen;
        if (screen === 'confirm') state.editingFromConfirm = false;
        render({ moveFocus: true });
        window.scrollTo(0, 0);
      }

      function back() {
        stopCamera();
        if (state.screen === 'photo') cancelPhotoWork();
        let previous = state.history.pop();
        if (!previous) return;
        state.screen = previous;
        if (previous === 'confirm') {
          state.editingFromConfirm = false;
          previous = firstInvalidScreen();
        }
        state.screen = previous;
        render({ moveFocus: true });
        window.scrollTo(0, 0);
      }

      function reset() {
        stopCamera();
        cancelPhotoWork();
        clearPhotoUi();
        state.screen = 'start';
        state.history = [];
        state.symptom = null;
        state.adviceKey = null;
        state.result = null;
        state.editingFromConfirm = false;
        state.fromPhoto = false;
        state.values = Object.fromEntries(meta.features.map((feature) => [feature, '']));
        render({ moveFocus: true });
      }

      function stopCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
        }
        const video = app.querySelector('[data-photo-video]');
        if (video) video.srcObject = null;
        cameraViewActive = false;
      }

      function cancelPhotoWork() {
        photoRunId += 1;
        photoBusy = false;
        const worker = activeWorker;
        activeWorker = null;
        if (worker) worker.terminate().catch(() => {});
      }

      function clearPhotoUi() {
        if (photoPreviewObjectUrl) URL.revokeObjectURL(photoPreviewObjectUrl);
        photoPreviewObjectUrl = '';
        photoPreviewSrc = '';
        photoCountMessage = '';
        photoErrorMessage = '';
      }

      function resetPhotoUi() {
        stopCamera();
        cancelPhotoWork();
        clearPhotoUi();
      }

      function loadTesseract() {
        if (window.Tesseract) return Promise.resolve(window.Tesseract);
        if (tesseractPromise) return tesseractPromise;
        tesseractPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          script.async = true;
          script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Tesseract.js is unavailable'));
          script.onerror = () => reject(new Error('Tesseract.js failed to load'));
          document.head.appendChild(script);
        });
        return tesseractPromise;
      }

      function previewSourceFor(source) {
        if (source && typeof source.toDataURL === 'function') return source.toDataURL('image/jpeg', .9);
        photoPreviewObjectUrl = URL.createObjectURL(source);
        return photoPreviewObjectUrl;
      }

      function loadImage(sourceUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('画像を読み込めませんでした'));
          image.src = sourceUrl;
        });
      }

      function otsuThreshold(grayscale) {
        const histogram = new Array(256).fill(0);
        grayscale.forEach((value) => { histogram[value] += 1; });
        const total = grayscale.length;
        let sum = 0;
        histogram.forEach((count, value) => { sum += value * count; });
        let sumBackground = 0;
        let weightBackground = 0;
        let bestThreshold = 127;
        let bestVariance = 0;
        for (let threshold = 0; threshold < 256; threshold += 1) {
          weightBackground += histogram[threshold];
          if (weightBackground === 0) continue;
          const weightForeground = total - weightBackground;
          if (weightForeground === 0) break;
          sumBackground += threshold * histogram[threshold];
          const meanBackground = sumBackground / weightBackground;
          const meanForeground = (sum - sumBackground) / weightForeground;
          const variance = weightBackground * weightForeground * (meanBackground - meanForeground) ** 2;
          if (variance > bestVariance) {
            bestVariance = variance;
            bestThreshold = threshold;
          }
        }
        return bestThreshold;
      }

      function preprocessImage(image) {
        const sourceWidth = image.naturalWidth || image.width;
        const sourceHeight = image.naturalHeight || image.height;
        const longSide = Math.max(sourceWidth, sourceHeight);
        const scale = 1600 / longSide;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));
        const context = canvas.getContext('2d', { willReadFrequently: true });
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const grayscale = new Array(canvas.width * canvas.height);
        let totalBrightness = 0;
        for (let index = 0, pixel = 0; index < imageData.data.length; index += 4, pixel += 1) {
          const luminance = Math.round(.299 * imageData.data[index] + .587 * imageData.data[index + 1] + .114 * imageData.data[index + 2]);
          grayscale[pixel] = luminance;
          totalBrightness += luminance;
        }
        const meanBrightness = totalBrightness / grayscale.length;
        // A mean below 128 means the LCD/photo is mostly dark, so invert it first.
        if (meanBrightness < 128) grayscale.forEach((value, index) => { grayscale[index] = 255 - value; });
        const threshold = otsuThreshold(grayscale);
        for (let pixel = 0, index = 0; pixel < grayscale.length; pixel += 1, index += 4) {
          const value = grayscale[pixel] >= threshold ? 255 : 0;
          imageData.data[index] = value;
          imageData.data[index + 1] = value;
          imageData.data[index + 2] = value;
          imageData.data[index + 3] = 255;
        }
        context.putImageData(imageData, 0, 0);
        return canvas;
      }

      async function runPhotoOcr(source) {
        const runId = ++photoRunId;
        photoBusy = true;
        photoCountMessage = '';
        photoErrorMessage = '';
        photoPreviewSrc = previewSourceFor(source);
        render({ moveFocus: false });
        let worker = null;
        try {
          const image = await loadImage(photoPreviewSrc);
          if (runId !== photoRunId || state.screen !== 'photo') return;
          const processedCanvas = preprocessImage(image);
          const tesseract = await loadTesseract();
          if (runId !== photoRunId || state.screen !== 'photo') return;
          worker = await tesseract.createWorker('eng');
          activeWorker = worker;
          await worker.setParameters({
            tessedit_char_whitelist: '0123456789.',
            tessedit_pageseg_mode: '11' // sparse text: keeps widely spaced numbers as separate tokens (psm 6 merged "172.2 175.6" into one). Must be a string: numeric values are silently ignored
          });
          const result = await worker.recognize(processedCanvas);
          if (runId !== photoRunId || state.screen !== 'photo') return;
          const numbers = ADKApp.extractNumbers(result?.data?.text || '');
          const readings = ADKApp.assignReadings(numbers, meta.features);
          if (!readings) {
            photoBusy = false;
            photoCountMessage = `数字を${numbers.length}個読み取りました（15個必要です）。うまく読み取れませんでした。`;
            render({ moveFocus: false });
            return;
          }
          state.values = readings;
          state.fromPhoto = true;
          photoBusy = false;
          clearPhotoUi();
          goToConfirmOrFirstInvalid();
        } catch (error) {
          if (runId !== photoRunId || state.screen !== 'photo') return;
          photoBusy = false;
          photoErrorMessage = '読み取りができませんでした。インターネットにつながっているか確認するか、手で入力してください。';
          render({ moveFocus: false });
        } finally {
          if (worker && activeWorker === worker) {
            activeWorker = null;
            await worker.terminate();
          }
        }
      }

      function triggerPhotoFile(kind) {
        const input = app.querySelector(`[data-photo-file="${kind}"]`);
        if (input) input.click();
      }

      async function startCamera() {
        if (photoBusy) return;
        photoCountMessage = '';
        photoErrorMessage = '';
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          triggerPhotoFile('camera');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          if (state.screen !== 'photo') {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }
          cameraStream = stream;
          cameraViewActive = true;
          render({ moveFocus: false });
          const video = app.querySelector('[data-photo-video]');
          video.srcObject = stream;
          await video.play();
        } catch (error) {
          stopCamera();
          cameraViewActive = false;
          render({ moveFocus: false });
          triggerPhotoFile('camera');
        }
      }

      function captureCameraFrame() {
        if (photoBusy || !cameraStream) return;
        const video = app.querySelector('[data-photo-video]');
        if (!video || !video.videoWidth || !video.videoHeight) return;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        stopCamera();
        runPhotoOcr(canvas);
      }

      function continueWithManualInput() {
        resetPhotoUi();
        state.fromPhoto = false;
        go('input1');

      function fillDemo(kind) {

      function fieldIsValid(feature) {
        return ADKApp.isFeatureValid(feature, state.values[feature], meta.featureMeta[feature]);

      function hasValue(value) { return String(value ?? '').trim() !== ''; }

      function isOutOfRange(feature) {
        const info = meta.featureMeta[feature];

        return !info.isRotation && Number.isFinite(value) && (value < info.hardMin || value > info.hardMax);

      function rangeWarningMarkup(feature) {

      function adviceBlock(key) {
        const item = advice[key];
        const cautions = item.cautions || (item.caution ? [item.caution] : []);
        return `<section class="advice-block"><h3>${item.title}</h3><ol class="advice-steps">${item.steps.map((step) => `<li>${step}</li>`).join('')}</ol>${cautions.map((caution) => `<div class="caution"><strong>注意</strong>${caution}</div>`).join('')}</section>`;
      }

      function renderAdvice() {
        const keys = state.adviceKey === 'F' ? ['A', 'B', 'C', 'D', 'E'] : [state.adviceKey];
        return `<section class="screen" data-screen="advice">
          <h1 class="question-heading" tabindex="-1">対処法をお試しください</h1>
          <p class="lead">できるものから、ゆっくり確認してください。</p>
          <div class="advice-list">${keys.map(adviceBlock).join('')}</div>
          <div class="screen-actions">
            <p class="question-heading" style="margin-top: 8px;">これで直りましたか？</p>
            <button class="btn-primary" type="button" data-fixed>はい、直りました</button>
            <button class="btn-secondary" type="button" data-not-fixed>いいえ、直りません</button>
          </div>
        </section>`;
      }

      function renderPhone() {
        return `<section class="screen" data-screen="phone">
          <div class="result-card fault">
            <span class="result-icon" aria-hidden="true">📞</span>
            <h1 class="screen-heading" tabindex="-1">お電話ください</h1>
            <p class="lead">作業員がうかがいます。お電話ください。</p>
            <a class="btn-call" href="tel:0120-000-000">📞 修理窓口に電話する 0120-000-000</a>
          </div>
          <div class="screen-actions"><button class="btn-secondary" type="button" data-reset>最初からやりなおす</button></div>
        </section>`;
      }

      function renderComplete() {
        return `<section class="screen" data-screen="complete">
          <div class="result-card safe">
            <span class="complete-mark" aria-hidden="true">✓</span>
            <h1 class="screen-heading" tabindex="-1">ご確認ありがとうございました</h1>
            <p class="lead">また困ったときはいつでもお使いください。</p>
          </div>
          <div class="screen-actions"><button class="btn-primary" type="button" data-reset>最初にもどる</button></div>
        </section>`;
      }

      function render({ moveFocus = true, focusSelector = null, restoreScrollY = null } = {}) {
        const screen = state.screen;
        const progress = progressFor(screen);
        backButton.hidden = screen === 'start' || state.history.length === 0;
        progressWrap.hidden = progress === 0;
        if (progress > 0) {
          progressLabel.textContent = screen === 'photo' ? '写真で入力' : `ステップ ${progress} / 5`;
          progressBar.style.width = `${progress * 20}%`;
          progressTrack.setAttribute('aria-valuenow', String(progress));
        }
        if (screen === 'start') app.innerHTML = renderStart();
        if (screen === 'photo') app.innerHTML = renderPhoto();
        if (screen.startsWith('input')) app.innerHTML = renderInput(groupForScreen(screen));
        if (screen === 'confirm') app.innerHTML = renderConfirm();
        if (screen === 'fault') app.innerHTML = renderFault();
        if (screen === 'safe-choice') app.innerHTML = renderChoice();
        if (screen === 'advice') app.innerHTML = renderAdvice();
        if (screen === 'phone') app.innerHTML = renderPhone();
        if (screen === 'complete') app.innerHTML = renderComplete();
        if (moveFocus) {
          const heading = app.querySelector('[tabindex="-1"]');
          if (heading) window.setTimeout(() => heading.focus(), 0);
        } else {
          window.setTimeout(() => {
            const focusTarget = focusSelector ? app.querySelector(focusSelector) : null;
            if (focusTarget) {
              try {
                focusTarget.focus({ preventScroll: true });
              } catch (error) {
                focusTarget.focus();
              }
            }
            if (restoreScrollY !== null) window.scrollTo(0, restoreScrollY);
          }, 0);
        }
      }

      function refreshValidation() {
        const group = groupForScreen(state.screen);
        if (!group) return;
        group.features.forEach((feature) => {
          const field = app.querySelector(`[data-field="${feature}"]`);
          if (!field) return;
          const invalid = hasValue(state.values[feature]) && !fieldIsValid(feature);
          field.classList.toggle('is-invalid', invalid);
          const error = field.querySelector('.field-error');
          if (error) error.textContent = invalid ? validationMessage(feature) : '';
          const warning = field.querySelector('.field-range-warning');
          if (warning) warning.hidden = !isOutOfRange(feature);
        });
        const valid = groupIsValid(group);
        const next = app.querySelector('[data-next-group]');
        const reason = app.querySelector('.next-reason');
        if (next) next.disabled = !valid;
        if (reason) reason.textContent = valid ? '入力できたら、次へ進んでください。' : '5つの数字を入力すると、次へ進めます。';
      }

      function stepValue(feature, direction) {
        const current = ADKApp.parseValue(state.values[feature]);
        const base = Number.isFinite(current) ? current : Number(meta.featureMeta[feature].p1);
        state.values[feature] = (base + direction * 0.5).toFixed(1);
        const scrollY = window.scrollY;
        render({ moveFocus: false, focusSelector: `[data-input-feature="${feature}"]`, restoreScrollY: scrollY });
      }

      app.addEventListener('input', (event) => {
        const input = event.target.closest('[data-input-feature]');
        if (!input) return;
        const feature = input.dataset.inputFeature;
        state.values[feature] = input.value;
        refreshValidation();
      });

      app.addEventListener('change', (event) => {
        const input = event.target.closest('[data-photo-file]');
        if (!input || !input.files || !input.files[0] || photoBusy) return;
        const file = input.files[0];
        input.value = '';
        runPhotoOcr(file);
      });

      app.addEventListener('click', (event) => {
        const target = event.target.closest('button, a');
        if (!target) return;
        if (target.matches('[data-start]')) {
          state.fromPhoto = false;
          go('input1');
        }
        if (target.matches('[data-photo-screen]')) {
          state.fromPhoto = false;
          resetPhotoUi();
          go('photo');
        }
        if (target.matches('[data-photo-camera]')) startCamera();
        if (target.matches('[data-photo-saved]')) triggerPhotoFile('saved');
        if (target.matches('[data-photo-shutter]')) captureCameraFrame();
        if (target.matches('[data-photo-cancel]')) {
          stopCamera();
          render({ moveFocus: false });
        }
        if (target.matches('[data-photo-retry]')) {
          resetPhotoUi();
          render({ moveFocus: false });
        }
        if (target.matches('[data-photo-manual]')) continueWithManualInput();
        if (target.matches('[data-demo]')) fillDemo(target.dataset.demo);
        if (target.matches('[data-step-feature]')) stepValue(target.dataset.stepFeature, Number(target.dataset.stepDirection));
        if (target.matches('[data-rotation]')) {
          const feature = target.dataset.rotation;
          state.values[feature] = target.dataset.value;
          const scrollY = window.scrollY;
          render({ moveFocus: false, focusSelector: `[data-rotation="${feature}"][data-value="${target.dataset.value}"]`, restoreScrollY: scrollY });
        }
        if (target.matches('[data-next-group]')) {
          if (state.editingFromConfirm) goToConfirmOrFirstInvalid();
          else { const next = Number(target.dataset.nextGroup) + 1; if (next <= 3) go(`input${next}`); else goToConfirmOrFirstInvalid(); }
        }
        if (target.matches('[data-edit-group]')) { state.editingFromConfirm = true; go(`input${target.dataset.editGroup}`); }
        if (target.matches('[data-judge]')) {
          if (!ADKApp.allValid(state.values, meta.features, meta.featureMeta)) {
            go(firstInvalidScreen());
            return;
          }
          state.result = ADKApp.judge(state.values, meta.features, meta.threshold);
          go(state.result === 'fault' ? 'fault' : 'safe-choice');
        }
        if (target.matches('[data-emergency]')) go('phone');
        if (target.matches('[data-symptom]')) {
          state.symptom = target.dataset.symptom;
          render({ moveFocus: false, focusSelector: `[data-symptom="${state.symptom}"]`, restoreScrollY: window.scrollY });
        }
        if (target.matches('[data-advice]')) { state.adviceKey = state.symptom; go('advice'); }
        if (target.matches('[data-fixed]')) go('complete');
        if (target.matches('[data-not-fixed]')) go('phone');
        if (target.matches('[data-reset]')) reset();
      });

      backButton.addEventListener('click', back);
      window.addEventListener('pagehide', stopCamera);
      render({ moveFocus: true });
    })();
  </script>
</body>
</html>
